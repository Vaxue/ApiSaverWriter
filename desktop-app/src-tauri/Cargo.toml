[package]
name = "apisaverwriter"
version = "0.1.7"
description = "AI Novel Writing Assistant - 用最少的API写出最火的小说"
authors = ["you"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Vaxue/ApiSaverWriter"
edition = "2021"

[lib]
name = "apisaverwriter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"

[target.'cfg(target_os = "ios")'.dependencies]
# Native on-device GGUF inference through Metal. The model is loaded from the
# bundled local-model resource; no localhost server or LAN is involved.
llama-cpp-4 = { version = "0.5.0", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "android")'.dependencies]
# CPU NEON is the conservative Android baseline; Vulkan can be enabled in a
# later ABI-specific build once device coverage is verified.
llama-cpp-4 = { version = "0.5.0", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
