name: Publish v0.1.7 From Verified Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag
        required: true
        default: v0.1.7
      source_run:
        description: Verified desktop/mobile build run
        required: true
        default: '34200511897'
      ios_run:
        description: Verified iOS build run
        required: true
        default: '34194757193'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified Windows/macOS/Android artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/source release-assets/ios
          download_artifact() {
            name="$1"
            outdir="release-assets/source/$name"
            mkdir -p "$outdir"
            artifact_url="$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$name\") | .archive_download_url" | head -n1)"
            test -n "$artifact_url"
            zipfile="$RUNNER_TEMP/$name.zip"
            : > "$zipfile"
            ok=0
            for attempt in $(seq 1 12); do
              echo "下载 $name，第 $attempt/12 次（支持断点续传）"
              if curl -fL --retry 3 --retry-all-errors --retry-delay 8 -C - \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                "$artifact_url" -o "$zipfile"; then
                ok=1
                break
              fi
              sleep 10
            done
            test "$ok" = 1
            unzip -q "$zipfile" -d "$outdir"
          }
          download_artifact windows-x64
          download_artifact macos-x64
          download_artifact macos-arm64
          download_artifact android-arm64
      - name: Download verified iOS artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IOS_RUN: ${{ inputs.ios_run }}
        run: |
          set -euo pipefail
          name='ios-v0.1.7-native-local-model'
          outdir='release-assets/ios'
          mkdir -p "$outdir"
          artifact_url="$(gh api "repos/${{ github.repository }}/actions/runs/$IOS_RUN/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$name\") | .archive_download_url" | head -n1)"
          test -n "$artifact_url"
          zipfile="$RUNNER_TEMP/ios.zip"
          : > "$zipfile"
          ok=0
          for attempt in $(seq 1 12); do
            echo "下载 iOS，第 $attempt/12 次（支持断点续传）"
            if curl -fL --retry 3 --retry-all-errors --retry-delay 8 -C - \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$artifact_url" -o "$zipfile"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1
          unzip -q "$zipfile" -d "$outdir"
      - name: Flatten and validate packages
        shell: bash
        run: |
          set -euo pipefail
          find release-assets/source -type f -exec cp {} release-assets/ \;
          find release-assets/ios -type f -exec cp {} release-assets/ \;
          rm -rf release-assets/source release-assets/ios
          # Only publish user-facing installers; never upload build intermediates,
          # sidecars, Rust build scripts, or the developer xcarchive bundle.
          keep='ApiSaverWriter_0.1.7_aarch64.dmg ApiSaverWriter_0.1.7_x64.dmg ApiSaverWriter_0.1.7_x64-setup.exe ApiSaverWriter_0.1.7_x64_en-US.msi ApiSaverWriter_v0.1.7_Android_arm64.apk ApiSaverWriter_v0.1.7_Android_arm64.aab ApiSaverWriter_iOS_v0.1.7_unsigned.ipa'
          for file in release-assets/*; do
            [ -f "$file" ] || continue
            case " $keep " in *" $(basename "$file") "*) ;; *) rm -f "$file" ;; esac
          done
          echo 'Published files:'
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ inputs.release_tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_tag }}" --repo "${{ github.repository }}" --title "${{ inputs.release_tag }}" --notes "ApiSaverWriter ${{ inputs.release_tag }} 全平台安装包"
          gh release upload "${{ inputs.release_tag }}" --repo "${{ github.repository }}" release-assets/* --clobber
      - name: Sync download links to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOC_URL: https://plwenpndps.feishu.cn/wiki/TQKNwxbzUitID3kWxOicv58vnqa
          FEISHU_AS: bot
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOWNLOAD_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo '飞书应用密钥未配置，GitHub Release 已完成；跳过飞书同步。'
            exit 0
          fi
          npm install -g @larksuite/cli@1.0.89
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name apisaverwriter-release --app-id "$FEISHU_APP_ID" --app-secret-stdin
          npm run sync:feishu-release
