name: iOS Local Model Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '0.1.7'
      upload_release:
        description: '上传到 GitHub Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  ios:
    name: iOS arm64 native local model
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install iOS build tools
        run: brew install cocoapods xcodegen libimobiledevice
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Download MiniCPM5 Q4_K_M
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-model"
          curl -L --fail --retry 5 --retry-delay 3 --continue-at - \
            "https://modelscope.cn/models/OpenBMB/MiniCPM5-2B-GGUF/resolve/master/MiniCPM5-2B-Q4_K_M.gguf" \
            -o "$RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf"
          echo "APISAVERWRITER_LOCAL_MODEL=$RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf" >> "$GITHUB_ENV"
          echo "APISAVERWRITER_BUNDLE_LOCAL_MODEL=1" >> "$GITHUB_ENV"
      - name: Configure iOS SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang="$(xcrun --sdk iphoneos --find clang)"
          clangxx="$(xcrun --sdk iphoneos --find clang++)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_SYSROOT=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_SYSTEM_NAME=iOS" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_ARCHITECTURES=arm64" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=16.0" >> "$GITHUB_ENV"
          echo "CC=$clang" >> "$GITHUB_ENV"
          echo "CXX=$clangxx" >> "$GITHUB_ENV"
          echo "CFLAGS=-isysroot $sdk -miphoneos-version-min=16.0" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isysroot $sdk -miphoneos-version-min=16.0" >> "$GITHUB_ENV"
      - name: Prepare iOS resources
        shell: bash
        env:
          TAURI_ENV_PLATFORM: ios
        run: |
          set -euo pipefail
          npm run prepare:agent-runtime --prefix desktop-app
          npm run prepare:local-model --prefix desktop-app
      - name: Build unsigned iOS archive
        working-directory: desktop-app
        env:
          CMAKE_SYSTEM_NAME: iOS
          CMAKE_OSX_SYSROOT: iphoneos
          CMAKE_OSX_ARCHITECTURES: arm64
          SDKROOT: iphoneos
          IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        run: |
          set -euo pipefail
          npx tauri ios init --ci
          npm run ios:build -- --target aarch64 --ci --no-sign --archive-only
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets ios-package/Payload
          archive="$(find desktop-app/src-tauri/gen/apple/build -type d -name '*.xcarchive' -print -quit)"
          test -n "$archive"
          app="$(find "$archive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          cp -R "$app" ios-package/Payload/
          (cd ios-package && zip -qry "../release-assets/ApiSaverWriter_iOS_v${{ inputs.version }}_unsigned.ipa" Payload)
          tar -C "$(dirname "$archive")" -czf "release-assets/ApiSaverWriter_iOS_v${{ inputs.version }}.xcarchive.tar.gz" "$(basename "$archive")"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-v${{ inputs.version }}-native-local-model
          path: release-assets/*
          if-no-files-found: error
      - name: Upload iOS assets to release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: release-assets/*
