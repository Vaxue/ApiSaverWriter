name: ApiSaverWriter Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos-arm
          - macos-intel
          - android
          - ios
      release_tag:
        description: "发布版本，例如 v0.1.4"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, runner: windows-latest, kind: windows }
          - { label: macos-apple-silicon, runner: macos-latest, kind: macos-arm }
          - { label: macos-intel, runner: macos-15-intel, kind: macos-intel }
          - { label: android, runner: ubuntu-latest, kind: android }
          - { label: ios, runner: macos-latest, kind: ios }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android Rust target
        if: matrix.kind == 'android'
        run: rustup target add aarch64-linux-android
      - name: Add iOS Rust target
        if: matrix.kind == 'ios'
        run: rustup target add aarch64-apple-ios
      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        if: matrix.kind == 'android'
      - name: Install iOS build tools
        if: matrix.kind == 'ios'
        run: brew install cocoapods xcodegen libimobiledevice
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Build Windows
        if: matrix.kind == 'windows'
        run: npm run tauri:build --prefix desktop-app
      - name: Package Windows assets
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Get-ChildItem desktop-app/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object { Copy-Item $_.FullName release-assets/ -Force }
      - name: Build macOS Apple Silicon
        if: matrix.kind == 'macos-arm'
        run: npm run tauri:build --prefix desktop-app -- --target aarch64-apple-darwin
      - name: Build macOS Intel
        if: matrix.kind == 'macos-intel'
        run: npm run tauri:build --prefix desktop-app -- --target x86_64-apple-darwin
      - name: Package macOS assets
        if: startsWith(matrix.kind, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          arch="AppleSilicon"
          [ "${{ matrix.kind }}" = "macos-intel" ] && arch="Intel"
          dmg="$(find desktop-app/src-tauri/target -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$dmg"
          cp "$dmg" "release-assets/ApiSaverWriter_${{ inputs.release_tag || github.ref_name }}_macOS_${arch}.dmg"
          app="$(find desktop-app/src-tauri/target -path '*/release/bundle/macos/*.app' -print -quit)"
          test -n "$app"
          tar -C "$(dirname "$app")" -czf "release-assets/ApiSaverWriter_${{ inputs.release_tag || github.ref_name }}_macOS_${arch}.app.tar.gz" "$(basename "$app")"
      - name: Prepare Android SDK
        if: matrix.kind == 'android'
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build Android
        if: matrix.kind == 'android'
        working-directory: desktop-app
        run: |
          npx tauri android init --ci
          # 发布包只构建 arm64-v8a：它覆盖当前绝大多数 Android 手机，
          # 也避免一次性编译四个 Rust ABI 造成 CI 长时间无输出。
          npm run android:build -- --ci --target aarch64 --apk --aab
      - name: Restore Android release signing key
        if: matrix.kind == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apisaverwriter-release.jks"
            echo "使用仓库固定 Android 发布签名密钥。"
          else
            echo "未配置 ANDROID_KEYSTORE_BASE64，生成本次构建签名密钥。配置固定密钥后可保持跨版本覆盖安装。"
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/apisaverwriter-release.jks" \
              -storepass apisaverwriter-ci \
              -keypass apisaverwriter-ci \
              -alias apisaverwriter \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=ApiSaverWriter,O=ApiSaverWriter,C=CN"
          fi
      - name: Sign and verify Android release assets
        if: matrix.kind == 'android'
        shell: bash
        env:
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          ANDROID_VERSION_CODE: 14
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/apisaverwriter-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:=apisaverwriter-ci}"
          : "${ANDROID_KEY_ALIAS:=apisaverwriter}"
          : "${ANDROID_KEY_PASSWORD:=apisaverwriter-ci}"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          scripts/package-android-release.sh release-assets "${{ inputs.release_tag || github.ref_name }}"
      - name: Build unsigned iOS archive
        if: matrix.kind == 'ios'
        working-directory: desktop-app
        run: |
          npx tauri ios init --ci
          npm run ios:build -- --target aarch64 --ci --no-sign --archive-only
      - name: Package unsigned iOS assets
        if: matrix.kind == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets ios-package/Payload
          archive="$(find desktop-app/src-tauri/gen/apple/build -type d -name '*.xcarchive' -print -quit)"
          test -n "$archive"
          app="$(find "$archive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          cp -R "$app" ios-package/Payload/
          (cd ios-package && zip -qry "../release-assets/ApiSaverWriter_${{ inputs.release_tag || github.ref_name }}_iOS_unsigned.ipa" Payload)
          tar -C "$(dirname "$archive")" -czf "release-assets/ApiSaverWriter_${{ inputs.release_tag || github.ref_name }}_iOS_unsigned.xcarchive.tar.gz" "$(basename "$archive")"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
      - name: Publish install packages to public distribution repository
        env:
          GH_TOKEN: ${{ secrets.DISTRIBUTION_GITHUB_TOKEN }}
          DISTRIBUTION_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY || 'Vaxue/AI-xiaoshuo-xiezuo-ruanjian' }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "DISTRIBUTION_GITHUB_TOKEN 未配置，跳过公开分发仓库发布。"
            exit 0
          fi
          gh release view "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes "AI写小说软件 $RELEASE_TAG 安装包。本仓库只提供安装包，不包含源代码。"
          gh release upload "$RELEASE_TAG" --repo "$DISTRIBUTION_REPOSITORY" release-assets/* --clobber
      - name: Sync release notes to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOC_URL: ${{ secrets.FEISHU_DOC_URL || 'https://my.feishu.cn/wiki/TQKNwxbzUitID3kWxOicv58vnqa' }}
          FEISHU_AS: bot
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOWNLOAD_REPOSITORY: ${{ vars.DISTRIBUTION_REPOSITORY || 'Vaxue/AI-xiaoshuo-xiezuo-ruanjian' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo "飞书应用密钥未配置，跳过版本文档同步。"
            exit 0
          fi
          npm install -g @larksuite/cli@1.0.89
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name apisaverwriter-release --app-id "$FEISHU_APP_ID" --app-secret-stdin
          npm run sync:feishu-release
