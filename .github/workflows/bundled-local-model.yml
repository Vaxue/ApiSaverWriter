name: Bundled Local Model Desktop Builds

on:
  workflow_dispatch:
  push:
    tags: ["local-v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64-local, runner: windows-latest, kind: windows }
          - { label: macos-arm64-local, runner: macos-latest, kind: macos-arm }
          - { label: macos-x64-local, runner: macos-15-intel, kind: macos-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm ci --prefix desktop-app

      - name: Download MiniCPM5-2B Q4_K_M
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-model"
          curl -L --fail --retry 5 --retry-delay 3 --continue-at - \
            "https://modelscope.cn/models/OpenBMB/MiniCPM5-2B-GGUF/resolve/master/MiniCPM5-2B-Q4_K_M.gguf" \
            -o "$RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf"

      - name: Download MiniCPM5-2B Q4_K_M (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/local-model" | Out-Null
          curl.exe -L --fail --retry 5 --retry-delay 3 --continue-at - `
            "https://modelscope.cn/models/OpenBMB/MiniCPM5-2B-GGUF/resolve/master/MiniCPM5-2B-Q4_K_M.gguf" `
            -o "$env:RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf"

      - name: Build llama-server (Unix)
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama-server --parallel 2
          server="$(find "$RUNNER_TEMP/llama-build" -type f -name llama-server -perm -111 | head -n 1)"
          test -n "$server"
          echo "APISAVERWRITER_LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "APISAVERWRITER_LOCAL_MODEL=$RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf" >> "$GITHUB_ENV"
          echo "APISAVERWRITER_BUNDLE_LOCAL_MODEL=1" >> "$GITHUB_ENV"

      - name: Build llama-server (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$env:RUNNER_TEMP/llama.cpp"
          cmake -S "$env:RUNNER_TEMP/llama.cpp" -B "$env:RUNNER_TEMP/llama-build" `
            -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build "$env:RUNNER_TEMP/llama-build" --config Release --target llama-server --parallel 2
          $server = Get-ChildItem "$env:RUNNER_TEMP/llama-build" -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe not found" }
          "APISAVERWRITER_LLAMA_SERVER=$($server.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APISAVERWRITER_LOCAL_MODEL=$env:RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APISAVERWRITER_BUNDLE_LOCAL_MODEL=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build bundled Windows app
        if: matrix.kind == 'windows'
        run: npm run tauri:build --prefix desktop-app
      - name: Build bundled macOS Apple Silicon app
        if: matrix.kind == 'macos-arm'
        run: npm run tauri:build --prefix desktop-app -- --target aarch64-apple-darwin
      - name: Build bundled macOS Intel app
        if: matrix.kind == 'macos-intel'
        run: npm run tauri:build --prefix desktop-app -- --target x86_64-apple-darwin

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop-app/src-tauri/target -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
