name: Full Platform Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.1.7'
        required: true
        default: '0.1.7'
      release_tag:
        description: '发布标签，例如 v0.1.7'
        required: true
        default: 'v0.1.7'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: windows-x64, runner: windows-latest, kind: windows }
          - { label: macos-arm64, runner: macos-latest, kind: macos-arm }
          - { label: macos-x64, runner: macos-15-intel, kind: macos-intel }
          - { label: android-arm64, runner: ubuntu-latest, kind: android }
          - { label: ios-arm64, runner: macos-latest, kind: ios }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android Rust target
        if: matrix.kind == 'android'
        run: rustup target add aarch64-linux-android
      - name: Add iOS Rust target
        if: matrix.kind == 'ios'
        run: rustup target add aarch64-apple-ios
      - uses: actions/setup-java@v4
        if: matrix.kind == 'android'
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        if: matrix.kind == 'android'
      - name: Install iOS build tools
        if: matrix.kind == 'ios'
        run: brew install cocoapods xcodegen libimobiledevice
      - run: npm ci
      - run: npm ci --prefix desktop-app
      - name: Prepare Android SDK
        if: matrix.kind == 'android'
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Download MiniCPM5 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-model"
          curl -L --fail --retry 5 --retry-delay 3 --continue-at - \
            "https://modelscope.cn/models/OpenBMB/MiniCPM5-2B-GGUF/resolve/master/MiniCPM5-2B-Q4_K_M.gguf" \
            -o "$RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf"
          echo "APISAVERWRITER_LOCAL_MODEL=$RUNNER_TEMP/local-model/MiniCPM5-2B-Q4_K_M.gguf" >> "$GITHUB_ENV"
          echo "APISAVERWRITER_BUNDLE_LOCAL_MODEL=1" >> "$GITHUB_ENV"
      - name: Build llama-server for desktop
        if: matrix.kind == 'windows' || matrix.kind == 'macos-arm' || matrix.kind == 'macos-intel'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama-build" -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/llama-build" --config Release --target llama-server --parallel 2
          server="$(find "$RUNNER_TEMP/llama-build" -type f \( -name llama-server -o -name llama-server.exe \) -print -quit)"
          test -n "$server"
          echo "APISAVERWRITER_LLAMA_SERVER=$server" >> "$GITHUB_ENV"
      - name: Configure Android bindgen sysroot
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_NDK=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> "$GITHUB_ENV"
      - name: Configure iOS SDK toolchain
        if: matrix.kind == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang="$(xcrun --sdk iphoneos --find clang)"
          clangxx="$(xcrun --sdk iphoneos --find clang++)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_SYSROOT=$sdk" >> "$GITHUB_ENV"
          echo "CMAKE_SYSTEM_NAME=iOS" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_ARCHITECTURES=arm64" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=16.0" >> "$GITHUB_ENV"
          echo "CC=$clang" >> "$GITHUB_ENV"
          echo "CXX=$clangxx" >> "$GITHUB_ENV"
          echo "CFLAGS=-isysroot $sdk -miphoneos-version-min=16.0" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-isysroot $sdk -miphoneos-version-min=16.0" >> "$GITHUB_ENV"
      - name: Prepare packaged runtime resources
        shell: bash
        env:
          TAURI_ENV_PLATFORM: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          npm run prepare:agent-runtime --prefix desktop-app
          npm run prepare:local-model --prefix desktop-app
      - name: Build Windows
        if: matrix.kind == 'windows'
        run: npm run tauri:build --prefix desktop-app
      - name: Build macOS ARM
        if: matrix.kind == 'macos-arm'
        run: npm run tauri:build --prefix desktop-app -- --target aarch64-apple-darwin
      - name: Build macOS Intel
        if: matrix.kind == 'macos-intel'
        run: npm run tauri:build --prefix desktop-app -- --target x86_64-apple-darwin
      - name: Build Android native local model
        if: matrix.kind == 'android'
        working-directory: desktop-app
        run: |
          npx tauri android init --ci
          npm run android:build -- --ci --target aarch64 --apk --aab
      - name: Build iOS native local model
        if: matrix.kind == 'ios'
        working-directory: desktop-app
        run: |
          npx tauri ios init --ci
          npm run ios:build -- --target aarch64 --ci --no-sign --archive-only
      - name: Restore Android release signing key
        if: matrix.kind == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apisaverwriter-release.jks"
          else
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/apisaverwriter-release.jks" \
              -storepass apisaverwriter-ci \
              -keypass apisaverwriter-ci \
              -alias apisaverwriter \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=ApiSaverWriter,O=ApiSaverWriter,C=CN"
          fi
      - name: Sign Android release assets
        if: matrix.kind == 'android'
        shell: bash
        env:
          ANDROID_BUILD_TOOLS_VERSION: 35.0.0
          ANDROID_VERSION_CODE: 14
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/apisaverwriter-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:=apisaverwriter-ci}"
          : "${ANDROID_KEY_ALIAS:=apisaverwriter}"
          : "${ANDROID_KEY_PASSWORD:=apisaverwriter-ci}"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          scripts/package-android-release.sh release-assets "${{ inputs.release_tag || github.ref_name }}"
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop-app/src-tauri/target -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          tag="${{ inputs.release_tag || github.ref_name }}"
          if [ -d desktop-app/src-tauri/gen/apple/build ]; then
            find desktop-app/src-tauri/gen/apple/build -type d -name '*.xcarchive' -print -quit > "$RUNNER_TEMP/archive.txt" || true
          else
            : > "$RUNNER_TEMP/archive.txt"
          fi
          archive="$(cat "$RUNNER_TEMP/archive.txt" 2>/dev/null || true)"
          if [ -n "$archive" ] && [ -d "$archive/Products/Applications" ]; then
            mkdir -p ios-package/Payload
            app="$(find "$archive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
            cp -R "$app" ios-package/Payload/
            (cd ios-package && zip -qry "../release-assets/ApiSaverWriter_${tag}_iOS_unsigned.ipa" Payload)
          fi
          test -n "$(find release-assets -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
      - name: Sync packages to Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOC_URL: https://plwenpndps.feishu.cn/wiki/TQKNwxbzUitID3kWxOicv58vnqa
          FEISHU_AS: bot
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOWNLOAD_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo 'FEISHU_APP_ID/FEISHU_APP_SECRET 未配置，跳过飞书同步。'
            exit 0
          fi
          npm install -g @larksuite/cli@1.0.89
          printf '%s' "$FEISHU_APP_SECRET" | lark-cli profile add --name apisaverwriter-release --app-id "$FEISHU_APP_ID" --app-secret-stdin
          npm run sync:feishu-release
